<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema de Seguridad - Amigo Secreto</title>
<style>
  :root {
    --bg: #0f1220;
    --card: #171b30;
    --border: #2a2f4a;
    --text: #eef0ff;
    --muted: #9aa0c3;
    --accent: #7c5cff;
    --accent2: #22d3a5;
    --danger: #ff5c7a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f4fb;
      --card: #ffffff;
      --border: #e1e4f5;
      --text: #1c1f33;
      --muted: #6a6f94;
    }
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100%;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  h1 {
    font-size: 1.3rem;
    letter-spacing: 0.03em;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 24px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    font-size: 0.95rem;
    padding: 10px 0;
    border-bottom: 1px dashed var(--border);
  }
  .row span:first-child { color: var(--muted); }
  .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  .countdown {
    margin: 24px 0 8px;
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }
  .status {
    margin-top: 18px;
    padding: 16px;
    border-radius: 14px;
    font-size: 0.95rem;
    background: rgba(255, 92, 122, 0.08);
    border: 1px solid rgba(255, 92, 122, 0.25);
    color: var(--danger);
  }
  .status.ok {
    background: rgba(34, 211, 165, 0.1);
    border-color: rgba(34, 211, 165, 0.35);
    color: var(--accent2);
  }
  .reveal {
    margin-top: 14px;
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    word-break: break-word;
  }
  .lock {
    font-size: 2rem;
    margin-bottom: 6px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="lock" id="lockIcon">🔒</div>
    <h1>MI AMIGO SECRETO</h1>
 
    <div class="row"><span>Hora actual (Colombia)</span><span id="horaActual">--:--:--</span></div>
    <div class="row"><span>Hora de liberación</span><span id="horaObjetivo">18:00:00</span></div>
 
    <div class="countdown" id="countdown">--:--:--</div>
 
    <div class="status" id="statusBox">
      <div>🔒 ACCESO DENEGADO</div>
      <div style="margin-top:6px; font-size:0.85rem; color:var(--muted);">
        El nombre está encriptado. Se revelará automáticamente a las 6:00 PM (hora Colombia).
      </div>
    </div>
  </div>
 
<script>
  var CODIGO_OCULTO = "14J25U36L52I94A18N63 52M84E71N49D62E12Z";
  var HORA_OBJETIVO_SEG = 18 * 3600 + 0 * 60; // 18:00:00 en segundos
 
  function decodificar(codigo) {
    var out = "";
    for (var i = 2; i < codigo.length; i += 3) out += codigo[i];
    return out;
  }
 
  function getColombiaParts() {
    // America/Bogota no usa horario de verano, siempre UTC-5
    var fmt = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'America/Bogota',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
    var parts = fmt.formatToParts(new Date());
    var h = 0, m = 0, s = 0;
    parts.forEach(function(p) {
      if (p.type === 'hour') h = parseInt(p.value, 10) % 24;
      if (p.type === 'minute') m = parseInt(p.value, 10);
      if (p.type === 'second') s = parseInt(p.value, 10);
    });
    return { h: h, m: m, s: s, totalSeg: h * 3600 + m * 60 + s };
  }
 
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
 
  function tick() {
    var t = getColombiaParts();
    document.getElementById('horaActual').textContent =
      pad(t.h) + ':' + pad(t.m) + ':' + pad(t.s);
 
    var statusBox = document.getElementById('statusBox');
    var countdownEl = document.getElementById('countdown');
    var lockIcon = document.getElementById('lockIcon');
 
    if (t.totalSeg >= HORA_OBJETIVO_SEG) {
      var nombre = decodificar(CODIGO_OCULTO);
      lockIcon.textContent = '🎉';
      countdownEl.textContent = '¡LIBERADO!';
      statusBox.className = 'status ok';
      statusBox.innerHTML =
        '<div>🎉 ¡ACCESO CONCEDIDO! 🎉</div>' +
        '<div class="reveal">✨ ' + nombre + ' ✨</div>';
    } else {
      var restante = HORA_OBJETIVO_SEG - t.totalSeg;
      var hh = Math.floor(restante / 3600);
      var mm = Math.floor((restante % 3600) / 60);
      var ss = restante % 60;
      countdownEl.textContent = pad(hh) + ':' + pad(mm) + ':' + pad(ss);
      lockIcon.textContent = '🔒';
      statusBox.className = 'status';
      statusBox.innerHTML =
        '<div>🔒 ACCESO DENEGADO</div>' +
        '<div style="margin-top:6px; font-size:0.85rem; color:var(--muted);">' +
        'El nombre está encriptado. Se revelará automáticamente a las 6:00 PM (hora Colombia).</div>';
    }
  }
 
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
